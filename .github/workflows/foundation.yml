name: Foundation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      rust: ${{ steps.changes.outputs.rust }}
      apple: ${{ steps.changes.outputs.apple }}
      full: ${{ steps.changes.outputs.full }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify affected quality gates
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export LUMI_CI_OUTPUT_FILE="$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/classify-ci-changes.sh --from-git "$BASE_SHA" "$HEAD_SHA"
          else
            ./scripts/classify-ci-changes.sh --all
          fi

      - name: Test conservative classification behavior
        run: ./scripts/test-ci-classification.sh

  docs:
    name: Documentation and visual assets
    needs: classify
    if: needs.classify.outputs.docs == '1' || needs.classify.outputs.full == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify documentation links and visual assets
        run: ./scripts/verify-docs.sh

  rust:
    name: Rust, contracts, and persistence
    needs: classify
    if: needs.classify.outputs.rust == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore portable Rust build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Rust, contracts, migrations, and performance
        run: ./scripts/verify-rust.sh

  apple:
    name: Apple Silicon application
    needs: classify
    if: needs.classify.outputs.apple == '1'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21 for the Pro DJ Link bridge
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Apple build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/Library/Caches/org.swift.swiftpm
            apps/macos/Packages/LumiProtocol/.build
            apps/macos/Packages/LumiDesignSystem/.build
            apps/macos/Packages/LumiLiveWorkspace/.build
            apps/macos/Packages/LumiLibraryWorkspace/.build
            apps/macos/Packages/LumiEngineClient/.build
            apps/ios/Packages/LumiRemoteClient/.build
            apps/ios/Packages/LumiRemoteFeature/.build
            bridges/prolink/target
            build/carabiner-runtime
            build/DerivedData
            build/engine-service-target
            build/maven-repository
            build/prolink-bridge-runtime
          key: apple-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'apps/macos/Lumi.xcodeproj/project.pbxproj', 'apps/macos/Packages/**/Package.swift', 'apps/ios/LumiRemote.xcodeproj/project.pbxproj', 'apps/ios/Packages/**/Package.swift') }}
          restore-keys: |
            apple-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare pinned Ableton Link runtime
        run: |
          if [[ ! -x build/carabiner-runtime/Carabiner ]]; then
            ./scripts/prepare-carabiner-runtime.sh
          fi

      - name: Verify Swift, Xcode, arm64 bundle, and visual evidence
        run: ./scripts/verify-apple.sh

  gate:
    name: Foundation gate
    if: always()
    needs:
      - classify
      - docs
      - rust
      - apple
    runs-on: ubuntu-24.04
    steps:
      - name: Require every affected quality gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_REQUIRED: ${{ needs.classify.outputs.docs }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          APPLE_REQUIRED: ${{ needs.classify.outputs.apple }}
          FULL_REQUIRED: ${{ needs.classify.outputs.full }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          [[ "$CLASSIFY_RESULT" == "success" ]]
          if [[ "$DOCS_REQUIRED" == "1" || "$FULL_REQUIRED" == "1" ]]; then
            [[ "$DOCS_RESULT" == "success" ]]
          fi
          if [[ "$RUST_REQUIRED" == "1" ]]; then
            [[ "$RUST_RESULT" == "success" ]]
          fi
          if [[ "$APPLE_REQUIRED" == "1" ]]; then
            [[ "$APPLE_RESULT" == "success" ]]
          fi
          echo "Every affected Foundation quality gate passed."
