  <title id="title">Lumi</title>
  <desc id="description">Phrase-aware lighting automation for DJ sets.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050609"/>
      <stop offset="0.48" stop-color="#090d13"/>
      <stop offset="1" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="46%" r="62%">
