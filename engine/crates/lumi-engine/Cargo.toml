[package]
name = "lumi-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lumi-deck-source = { path = "../lumi-deck-source" }
lumi-domain = { path = "../lumi-domain" }
lumi-planner = { path = "../lumi-planner" }
lumi-protocol = { path = "../lumi-protocol" }
lumi-simulator = { path = "../lumi-simulator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
