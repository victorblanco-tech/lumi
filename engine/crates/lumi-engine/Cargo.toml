[package]
name = "lumi-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lumi-deck-source = { path = "../lumi-deck-source" }
lumi-domain = { path = "../lumi-domain" }
lumi-lighting-output = { path = "../lumi-lighting-output" }
lumi-light-plans = { path = "../lumi-light-plans" }
lumi-local-playback = { path = "../lumi-local-playback" }
lumi-library = { path = "../lumi-library" }
lumi-library-demo = { path = "../lumi-library-demo" }
lumi-library-source = { path = "../lumi-library-source" }
lumi-library-sqlite = { path = "../lumi-library-sqlite" }
lumi-midi-coremidi = { path = "../lumi-midi-coremidi" }
lumi-midi-output = { path = "../lumi-midi-output" }
lumi-output-dry-run = { path = "../lumi-output-dry-run" }
lumi-planner = { path = "../lumi-planner" }
lumi-protocol = { path = "../lumi-protocol" }
lumi-prolink-input = { path = "../lumi-prolink-input" }
lumi-rekordbox-analysis = { path = "../lumi-rekordbox-analysis" }
lumi-rekordbox-device = { path = "../lumi-rekordbox-device" }
lumi-remote-protocol = { path = "../lumi-remote-protocol" }
lumi-simulator = { path = "../lumi-simulator" }
lumi-timing-output = { path = "../lumi-timing-output" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
