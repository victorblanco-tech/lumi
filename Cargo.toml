[workspace]
members = [
    "engine/crates/lumi-domain",
    "engine/crates/lumi-engine",
]
resolver = "3"

[workspace.package]
version = "0.0.1-dev"
edition = "2024"
rust-version = "1.97.1"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
